[package]
name = "wombat"
version = "1.3.0"
authors = ["n4n5 <its.just.n4n5@gmail.com>"]
edition = "2024"
description = "Hex file viewer"
license = "MIT"
homepage = "https://wombat.n4n5.dev/"
repository = "https://github.com/Its-Just-Nans/wombat"
documentation = "https://docs.rs/wombat"
keywords = ["file", "viewer", "hex"]
categories = ["visualization", "multimedia"]
include = ["LICENSE", "**/*.rs", "Cargo.toml", "assets/*", "./index.html"]


[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
# bladvak = { path = "../bladvak" }
bladvak = "1.3.25"
file-format = "0.29.0"
roxmltree = { version = "0.21.1", features = ["positions"] }
serde = { version = "1", features = ["derive"] }
x509-parser = "0.18.1"
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
md-5 = { version = "0.11.0", optional = true }

# temp fix https://github.com/rusticata/x509-parser/pull/231
time = { version = "0.3.54", features = ["wasm-bindgen"] }
base16ct = "1.0.0"
ahash = "0.8.12"
zip = "8.6.0"
base64 = "0.22.1"
uuid = "1.24.0"
serde_json = "1.0.151"
url = "2.5.8"
kamadak-exif = "0.6.1"

[features]
# yara only on native
default = ["hashing", "yara", "parsing"]
hashing = ["dep:sha1", "dep:sha2", "dep:md-5"]
yara = ["dep:yara-x"]
# used to disable the parsing window
parsing = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
yara-x = { version = "1.19.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
