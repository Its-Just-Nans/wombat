[package]
name = "wombat"
version = "1.0.7"
authors = ["n4n5 <its.just.n4n5@gmail.com>"]
edition = "2024"
description = "Hex file viewer"
license = "MIT"
homepage = "https://wombat.n4n5.dev/"
repository = "https://github.com/Its-Just-Nans/wombat"
documentation = "https://docs.rs/wombat"
keywords = ["file", "viewer", "hex"]
categories = ["visualization", "multimedia"]
include = ["LICENSE", "**/*.rs", "Cargo.toml", "assets/*", "./index.html"]


[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
# bladvak = { path = "../bladvak" }
bladvak = "1.2.9"
file-format = "0.28.0"
roxmltree = { version = "0.21.1", features = ["positions"] }
serde = { version = "1", features = ["derive"] }
x509-parser = "0.18.1"
sha1 = { version = "0.10.6", optional = true }
sha2 = { version = "0.10.9", optional = true }
md-5 = { version = "0.10.6", optional = true }

# temp fix https://github.com/rusticata/x509-parser/pull/231
time = { version = "0.3.47", features = ["wasm-bindgen"] }

[features]
default = ["hashing"]
hashing = ["dep:sha1", "dep:sha2", "dep:md-5"]

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
